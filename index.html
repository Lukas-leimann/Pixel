<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planta Geral UGC-PSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: uma câmera única sobre a planta (6300x2900); cada passo move a câmera para uma pasta ou ficha. */
:root{
  --bg:#123478; --ink:#eaf3ff; --line:#7fd0ff; --amber:#ffbb1f; --panel:rgba(10,30,76,.88);
  --display:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden;margin:0}
#view{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:6300px;height:2900px;transform-origin:0 0;
  transition:transform 1.15s cubic-bezier(.65,0,.25,1);will-change:transform}
#stage img{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#stage.px img{image-rendering:pixelated}
.open{opacity:0;transition:opacity .25s steps(3)}
.open.on{opacity:1}
.paper{position:absolute;opacity:0;pointer-events:none;transition:opacity .3s ease}
.paper.on{opacity:1}
.pin{position:absolute;left:0;top:0;width:100%;height:100%;transform:scale(var(--s0));opacity:0}
.paper.on .pin{animation:unfold .9s steps(9) .5s both}
@keyframes unfold{0%{opacity:1;transform:scale(var(--s0))}100%{opacity:1;transform:scale(1)}}
.paper .sk{opacity:0;transition:opacity .35s steps(4)}
.paper .sk.on{opacity:1}
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bar{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--line);
  padding:8px 10px 8px 14px;max-width:100%;box-shadow:0 0 0 2px #0a1e4c}
#lab{min-width:0;display:flex;flex-direction:column;line-height:1.15}
#lab b{font-weight:600;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lab span{font-size:13px;color:var(--line);letter-spacing:.06em;text-transform:uppercase}
#dots{display:flex;gap:4px}
#dots i{width:10px;height:10px;background:#1d4a9c;border:1px solid var(--line)}
#dots i.done{background:var(--line)} #dots i.cur{background:var(--amber);border-color:var(--amber)}
button{font:inherit;font-size:18px;background:var(--amber);color:#2a1a00;border:0;width:40px;height:36px;cursor:pointer;
  box-shadow:inset -3px -3px 0 #c98a00,inset 3px 3px 0 #ffd766}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button[disabled]{opacity:.35;cursor:default}
#title{position:fixed;left:50%;top:6%;transform:translateX(-50%);text-align:center;pointer-events:none;
  transition:opacity .5s;background:var(--panel);border:2px solid var(--line);padding:14px 26px;width:max-content;max-width:calc(100% - 32px)}
#title h1{margin:0;font-size:clamp(24px,4.2vw,52px);letter-spacing:.04em;font-weight:600}
#title p{margin:6px 0 0;font-size:clamp(13px,1.6vw,19px);color:var(--line);letter-spacing:.05em;text-transform:uppercase}
#title.hide{opacity:0}
@media(max-width:560px){#dots{display:none}}
@media(prefers-reduced-motion:reduce){#stage,.paper,.open,.paper .sk{transition-duration:.01s}.paper.on .pin{animation-duration:.01s;animation-delay:0s}}
</style>

</head>
<body>
<div id="view" aria-label="Apresentação">
  <div id="stage"><img id="planta" src="a/planta.png" alt="Planta da nave Pirate Titan Extended" width="6300" height="2900" style="left:0;top:0"></div>
</div>
<div id="title" class="hide"><h1 id="t1">OBRIGADO!</h1><p id="t2">11 salas · 11 skins</p></div>
<div id="hud"><div id="bar">
  <div id="lab"><b id="l1"></b><span id="l2"></span></div>
  <div id="dots" aria-hidden="true"></div>
  <button id="prev" aria-label="Voltar">◀</button><button id="next" aria-label="Avançar">▶</button>
</div></div>

<script>
const F=[
 ['A-01','Shield Wall',[900,1100,100,100],[900,1044,100,156],[30,562,1840,1120],[[540,852,100,100],[884,852,100,100],[1216,852,100,100]]],
 ['A-02','Battery Capacitor',[1300,1600,100,200],[1300,1488,100,312],[402,1112,1896,1064],[[400,696,100,200],[744,696,100,200],[1080,696,100,200],[1412,696,100,200]]],
 ['A-03','DFC Reactor',[1600,1100,400,200],[1600,988,400,312],[880,560,1840,1168],[[176,800,400,200],[720,800,400,200],[1264,800,400,200]]],
 ['A-04','Alligator Pool',[2100,1500,200,300],[2100,1336,200,464],[1280,960,1840,1216],[[648,748,200,300],[996,748,200,300]]],
 ['A-05','Neon City Tour',[2400,1100,200,200],[2400,988,200,312],[1580,586,1840,1116],[[648,748,200,200],[996,748,200,200]]],
 ['A-06','Celestial Flare',[2700,1600,200,200],[2700,1488,200,312],[1880,1060,1840,1168],[[476,800,200,200],[824,800,200,200],[1168,800,200,200]]],
 ['A-07','Cosmic Monolith',[3000,1100,200,300],[3000,936,200,464],[2180,508,1840,1320],[[476,852,200,300],[824,852,200,300],[1168,852,200,300]]],
 ['A-08','E.X.O Prisma',[3400,1500,400,300],[3400,1336,400,464],[2236,1012,2728,1112],[[76,644,400,300],[620,644,400,300],[1164,644,400,300],[1708,644,400,300],[2252,644,400,300]]],
 ['A-09','A.R.E.S Cannon',[4000,1100,300,300],[4000,936,300,464],[3230,560,1840,1216],[[324,748,300,300],[768,748,300,300],[1212,748,300,300]]],
 ['A-10','Mega PLA',[4300,1600,300,200],[4300,1488,300,312],[3530,1112,1840,1064],[[324,696,300,200],[768,696,300,200],[1212,696,300,200]]],
 ['A-11','Hyperplane Matrix',[4600,1100,300,200],[4600,988,300,312],[3802,534,1896,1220],[[340,852,300,200],[784,852,300,200],[1244,852,300,200]]],
];
const PNG=new Set(['A-01:0','A-01:1','A-01:2','A-02:0','A-02:1','A-02:2','A-02:3','A-05:0','A-06:0']);
const stage=document.getElementById('stage'),view=document.getElementById('view');
const px=(e,r)=>{e.style.left=r[0]+'px';e.style.top=r[1]+'px';e.style.width=r[2]+'px';e.style.height=r[3]+'px'};
const els=F.map(([id,name,c,o,p,sk])=>{
  const open=new Image();open.src=`a/open/${id}.png`;open.className='open';open.alt='';px(open,o);stage.appendChild(open);
  const paper=document.createElement('div');paper.className='paper';paper.style.left=p[0]+'px';paper.style.top=p[1]+'px';paper.style.width=p[2]+'px';paper.style.height=p[3]+'px';
  const pin=document.createElement('div');pin.className='pin';paper.appendChild(pin);
  pin.style.setProperty('--s0',Math.max(.05,o[2]*.7/p[2]).toFixed(3));
  pin.style.transformOrigin=`${o[0]+o[2]/2-p[0]}px ${o[1]+16-p[1]}px`;
  const frames=[1,2,3,4,5].map(i=>{const im=new Image();im.src=`a/fr/${id}_${i}.png`;return im.src});
  const bg=new Image();bg.src=`a/papel/${id}.png`;bg.alt='Ficha da skin '+id;bg.style.cssText=`left:0;top:0;width:${p[2]}px;height:${p[3]}px`;pin.appendChild(bg);
  const sks=sk.map((r,i)=>{const im=new Image();im.src=`a/skins/${id}/${i}.${PNG.has(id+':'+i)?'png':'gif'}`;im.className='sk';im.alt=`Versão ${i+1} da skin ${name}`;px(im,r);pin.appendChild(im);return im});
  stage.appendChild(paper);return {open,paper,sks,frames,final:open.src,timer:0,isOpen:false};
});
const S=[{t:'over'}];
F.forEach((f,i)=>{S.push({t:'zoom',i});for(let r=1;r<=f[5].length;r++)S.push({t:'open',i,r})});
S.push({t:'end'});
let n=0;
const dots=document.getElementById('dots');F.forEach(()=>dots.appendChild(document.createElement('i')));
const $=id=>document.getElementById(id);
function cam(cx,cy,w,h,bottom=0){
  const vw=innerWidth,vh=innerHeight-bottom,s=Math.min(vw/w,vh/h);
  return `translate(${vw/2-cx*s}px,${vh/2-cy*s}px) scale(${s})`;
}
function camScale(cx,cy,w,h,bottom){const vw=innerWidth,vh=innerHeight-bottom;return Math.min(vw/w,vh/h)}
let prev=null;
function setFolder(e,isOpen,animate){
  if(e.isOpen===isOpen&&!animate)return;
  clearTimeout(e.timer);e.isOpen=isOpen;
  if(!isOpen){e.open.classList.remove('on');e.open.src=e.final;return}
  if(!animate){e.open.src=e.final;e.open.classList.add('on');return}
  let k=0;e.open.src=e.frames[0];e.open.classList.add('on');
  const step=()=>{k++;if(k<e.frames.length){e.open.src=e.frames[k];e.timer=setTimeout(step,85)}else e.open.src=e.final};
  e.timer=setTimeout(step,85);
}
function render(){
  const st=S[n];let rect,bottom=0;
  if(st.t==='over'||st.t==='end'){rect=[3150,1450,6300*1.0,2900*1.0]}
  else{
    const f=F[st.i];
    if(st.t==='zoom'){const c=f[2];rect=[c[0]+c[2]/2,c[1]+c[3]/2,Math.max(c[2]*3.4,640),Math.max(c[3]*3.4,380)]}
    else{const p=f[4];rect=[p[0]+p[2]/2,p[1]+p[3]/2,p[2]*1.06,p[3]*1.06];bottom=70}
  }
  const s=camScale(...rect,bottom);
  stage.style.transform=cam(...rect,bottom);
  stage.classList.toggle('px',s>=1);
  const cur=st.t==='over'?-1:st.t==='end'?99:st.i;
  const animate=prev&&prev.t==='zoom'&&st.t==='open'&&prev.i===st.i&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
  els.forEach((e,j)=>{
    const isOpen=j<cur||(j===cur&&st.t==='open');
    setFolder(e,isOpen,animate&&j===st.i);
    const showP=j===cur&&st.t==='open';
    e.paper.classList.toggle('on',showP);
    e.sks.forEach((k,r)=>k.classList.toggle('on',showP&&r<st.r));
  });
  $('title').classList.toggle('hide',st.t!=='end');
  let a,b;
  if(st.t==='over'){a='Planta Geral';b='Pressione → para começar'}
  else if(st.t==='end'){a='Fim';b='11 de 11 pastas abertas'}
  else{const f=F[st.i];a=`${f[0]} · ${f[1]}`;
    if(st.t==='zoom')b='Pasta fechada';
    else{const tot=f[5].length;b=(st.r===1?'Original do jogo':'Revisão '+(st.r-1))+` · ${st.r} de ${tot}`}}
  $('l1').textContent=a;$('l2').textContent=b;
  [...dots.children].forEach((d,j)=>{d.className=j<cur?'done':j===cur?'cur':''});
  $('prev').disabled=n===0;$('next').disabled=n===S.length-1;
}
const go=d=>{const m=Math.max(0,Math.min(S.length-1,n+d));if(m===n)return;prev=S[n];n=m;render();prev=null};
$('next').onclick=e=>{e.stopPropagation();go(1)};$('prev').onclick=e=>{e.stopPropagation();go(-1)};
view.addEventListener('click',e=>go(e.clientX<innerWidth*.25?-1:1));
addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();go(1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}
  else if(e.key==='Home'){n=0;render()}else if(e.key==='End'){n=S.length-1;render()}
  else if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}}
});
let tx=null;view.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
view.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>50){go(d<0?1:-1);e.preventDefault()}});
addEventListener('resize',()=>{stage.style.transition='none';render();requestAnimationFrame(()=>stage.style.transition='')});
stage.style.transition='none';render();requestAnimationFrame(()=>requestAnimationFrame(()=>stage.style.transition=''));
</script>

</body>
</html>
